<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" role="img" aria-labelledby="title desc">
  <title id="title">A DAG executes signed native cells</title>
  <desc id="desc">Compilation checks source and emits pinned signed packages. Before any graph effects, a graph step verifies every manifest and executable. Fresh invocation authority then travels to scoped native workers; their checked outputs return to caller-owned state.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#567166"/></marker></defs>
  <rect width="900" height="230" rx="16" fill="#f5f7f3"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle" fill="#183c30">
    <g stroke="#567166" stroke-width="2" fill="#e3eee5">
      <rect x="22" y="44" width="190" height="114" rx="12"/>
      <rect x="244" y="44" width="190" height="114" rx="12"/>
      <rect x="466" y="44" width="190" height="114" rx="12"/>
      <rect x="688" y="44" width="190" height="114" rx="12"/>
    </g>
    <g font-size="17" font-weight="600"><text x="117" y="78">Check and compile</text><text x="339" y="78">Sign and pin</text><text x="561" y="78">Verify every cell</text><text x="783" y="78">Run native cells</text></g>
    <g font-size="14"><text x="117" y="108">Lean types and codecs</text><text x="117" y="132">Closure / graph audits</text><text x="339" y="108">Source + contract + ABI</text><text x="339" y="132">Manifest + worker hash</text><text x="561" y="108">Independent trust root</text><text x="561" y="132">Before graph effects</text><text x="783" y="108">Fresh call authority</text><text x="783" y="132">Scoped owned workers</text><text x="450" y="200">Caller-owned JSON keeps outcomes, producer cursors, scheduling and exact cell pins.</text></g>
  </g>
  <g stroke="#567166" stroke-width="2" marker-end="url(#arrow)"><path d="M214 101H240"/><path d="M436 101H462"/><path d="M658 101H684"/></g>
</svg>
