name: Lean Action CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Offline release gate regressions
        shell: bash
        run: bash ci/test-require-main-ci.sh
      # linen's native build dependencies (it builds its FFI as a dependency),
      # from linen's own list at the version lun requires.
      - uses: typednotes/linen/.github/actions/setup-native-deps@v1.10.0
        with:
          keyring: false
      - uses: leanprover/lean-action@v1
        with:
          test: false
      - run: lake test
      - run: lake build lun-example

  # The end-to-end test builds a real project against a linen carrying
  # `Control.Reactive` and `Control.Monad.Effect.Handler` (linen >= 1.3.0),
  # checked out next to lun, as `test/e2e.sh` expects: the version the image's
  # package cache holds, unless `LINEN_E2E_REF` says otherwise.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          path: lun
      - uses: actions/checkout@v7
        with:
          repository: typednotes/linen
          ref: ${{ vars.LINEN_E2E_REF || 'v1.11.0' }}
          path: linen
      - uses: typednotes/linen/.github/actions/setup-native-deps@v1.10.0
        with:
          keyring: false
      - run: sudo apt-get install -y jq
      - uses: astral-sh/setup-uv@v9
      - run: curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
      - run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lun/test/e2e.sh linen
      - run: uv run lun/test/local.py --linen linen
      - run: uv run lun/Examples/guide/run.py --linen linen --quiet
      - run: uv run lun/Examples/guide/run.py --linen linen --transport http --quiet
      - run: uv run lun/test/temporary_test.py "$RUNNER_TEMP"
